<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <!-- Menghubungkan ke file CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 1. Menu Navigasi di Bagian Atas -->
  <nav class="navbar">
    <div class="logo">MyWebsite</div>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="tentang.html">Tentang</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>
  </nav>

  <!-- 2. Konten Utama -->
  <h1>Halo, Nita!</h1>
  <p>Selamat datang di Patrol.</p>

  <!-- 3. Gambar Profil -->
  <img src="https://www.shutterstock.com/image-photo/wet-plate-photo-monkey-middle-260nw-2752597095.jpg">

  <br><br>

  <!-- 4. Tombol Link Eksternal -->
  <a href="https://google.com" target="_blank">
    <button>Kunjungi Google</button>
  </a>

  <!-- 5. Bagian Kartu / Flexbox Layout -->
  <section class="container-konten">
    <div class="card">
      <h3>Nama</h3>
      <p>Nita Fadilah Putri.</p>
    </div>
    <div class="card">
      <h3>Umur</h3>
      <p>25.</p>
    </div>
    <div class="card">
      <h3>Alamat</h3>
      <p>Patrol.</p>
    </div>
  </section>

  <!-- 6. Tombol Interaktif JavaScript -->
  <div style="text-align: center; margin-top: 20px;">
    <button onclick="sapaPengunjung()">Klik untuk Pesan Interaktif</button>
  </div>

  <!-- 7. Formulir Kontak -->
  <section class="form-container">
    <h2>Hubungi Kami</h2>
    <form>
      <div class="form-group">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama kamu...">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email kamu...">
      </div>

      <div class="form-group">
        <label for="pesan">Pesan:</label>
        <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan kamu di sini..."></textarea>
      </div>

      <button type="submit" class="btn-kirim">Kirim Pesan</button>
    </form>
  </section>

  <!-- Hubungkan file JavaScript (ditaruh sebelum tag penutup body) -->
  <script src="script.js"></script>
</body>

</html>
